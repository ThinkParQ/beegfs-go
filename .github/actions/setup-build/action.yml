name: "Set up Go build environment"
description: "Checks out beegfs-go and installs the Go and Zig toolchains goreleaser needs"

inputs:
  ref:
    description: "beegfs-go ref to check out (defaults to the triggering ref)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Named explicitly so this still works when a workflow using this action is called from
        # another repository: there the github context belongs to the caller, so an unqualified
        # checkout would fetch that repo instead of this one.
        repository: ThinkParQ/beegfs-go
        ref: ${{ inputs.ref || github.ref }}
        # goreleaser derives the version from tags.
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
